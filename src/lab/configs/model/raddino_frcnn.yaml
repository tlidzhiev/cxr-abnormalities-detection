_target_: lab.model.raddino_frcnn.RadDinoFasterRCNNModel
num_classes: 14
img_size: ${dataset.train.size} # input size of the detector (images are resized to it); by default the dataset size
model_name: microsoft/rad-dino # Hugging Face id of the ViT (Dinov2Model)
pretrained: true # false: random ViT (only the architecture), e.g. for inference from a detector checkpoint
feature_stride: 16 # stride of the ViT token grid on the image: 16 -> ViT input img_size * 14/16 (448 for 512), 8 -> img_size * 14/8 (896, 4x tokens)
drop_path_rate: 0.1 # stochastic depth of the ViT blocks
grad_checkpointing: false # true: recompute the ViT activations in backward (less memory, e.g. for feature_stride 8)
score_thresh: 0.001
max_detections: 300
small_anchors: true # anchors 16-256 instead of 32-512: small nodules on 512 px images
backbone_lr_mult: 1.0 # learning rate of the ViT relative to optimizer.lr
layer_lr_decay: 0.7 # layer-wise LR decay of the ViT blocks towards the input (ViTDet ViT-B: 0.7), 1.0 = off
