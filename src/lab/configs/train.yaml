hydra:
  run:
    dir: ${writer.log_dir}

defaults:
  - _self_
  - dataset: vinbigdata
  - dataloader: default
  - transforms: default
  - model: faster_rcnn
  - criterion: ${model}
  - metrics: default
  - optimizer: default
  - lr_scheduler: default
  - writer: cometml

trainer:
  # Steps
  total_steps: 12000 # total optimizer steps (about 38 sampler epochs of ~314 steps at batch size 16)
  eval_every_steps: 500 # validation frequency; also defines metric reporting windows
  checkpoint_every_steps: 2000 # periodic checkpoint frequency (~0.5 GB each with EMA)
  grad_accum_steps: 1 # batches per optimizer step (effective batch size = batch_size * grad_accum_steps)

  # Logging
  log_step: 100 # optimizer steps between train logs
  log_images: 4 # images in the logged grid of predictions
  debug: false # true to measure data_time / step_time (synchronizes CUDA at each step)

  # Checkpoints
  checkpoint_dir: ${writer.log_dir}/checkpoints
  resume_from: null # null or checkpoint file name inside checkpoint_dir (*.pth)
  from_pretrained: null # null or path to the model checkpoint (*.pth file)
  only_best: false # true to save only model-best.pth (requires monitor)
  monitor: "max val_mAP40" # "off" or "max/min metric_name"
  early_stop: null # evaluations without improvement before stopping

  # Hardware and numerics
  device: "auto" # device name or "auto"
  device_tensors: ["img", "boxes", "labels"]
  use_bfloat16: true # bf16 autocast for the convolutions; box geometry stays float32 (see FasterRCNNModel)
  use_tf32: true # TF32 tensor cores for fp32 matmul/conv on Ampere+ (L4)
  compile: null # null (eager) or torch.compile kwargs of the dense parts of the model, e.g. {fullgraph: true}
  skip_oom: true
  max_grad_norm: 10

  # Run
  seed: 42
  override: false # overwrite an existing run dir with the same writer.run_name
  ema:
    decay: 0.999
    update_every: 1
    warmup_steps: 1000 # steps with linearly increasing decay (0 = disabled)
