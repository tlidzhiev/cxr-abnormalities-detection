# Applied to a whole instance (image and boxes together), see lab.dataset.transforms
train:
  _target_: lab.dataset.transforms.DetectionTransform
  compose:
    _target_: albumentations.Compose
    _convert_: all
    transforms:
      - _target_: albumentations.HorizontalFlip
        p: 0.5
      - _target_: albumentations.Affine
        scale: [0.9, 1.1]
        translate_percent: [-0.05, 0.05]
        rotate: [-7, 7]
        rotate_method: ellipse # tighter boxes after rotation than 'largest_box'
        border_mode: 0 # cv2.BORDER_CONSTANT
        fill: 0
        p: 0.5
      - _target_: albumentations.RandomBrightnessContrast
        brightness_limit: 0.15
        contrast_limit: 0.15
        p: 0.5
      - _target_: albumentations.RandomGamma
        gamma_limit: [80, 120]
        p: 0.3
    bbox_params:
      _target_: albumentations.BboxParams
      format: pascal_voc # xyxy in pixels
      label_fields: [labels]
      clip: true
      min_visibility: 0.3 # drop the boxes mostly moved out of the image by Affine
      min_width: 1 # degenerate boxes break the detector losses
      min_height: 1

inference: null
