[project]
name = "cxr-abnormalities-detection"
version = "0.1.0"
description = "Abnormalities detection for Chest X-Ray images"
readme = "README.md"
authors = [
    { name = "tlidzhiev", email = "trlidzhiev@gmail.com" }
]
requires-python = "==3.15.2"
dependencies = [
    "albumentations==2.0.8",
    "comet-ml==3.58.10",
    "ensemble-boxes==1.0.10",
    "hydra-core==1.3.8",
    "iterative-stratification==0.1.9",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
download = [
    "kagglehub==1.0.3",
    "pandas==3.1.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "jupyter==1.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.3",
    "ty==0.0.94",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab"

[project.scripts]
train = "lab.train:main"
inference = "lab.inference:main"

[tool.ruff.format]
quote-style = "single"

[tool.ruff]
line-length = 100

[[tool.ty.overrides]]
include = ["src/lab/model/**", "src/lab/loss/**"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"
